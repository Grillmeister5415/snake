# SNAKE//SHIFT on the droplet. Lives in its own folder (~/snake) as its own compose project, apart
# from every other project on the server. Copied there by deploy.sh; never edited on the server.
#
# One small container that hands out the game's files from ./www (read-only). Caddy, which belongs
# to the Tichu project, reaches it as snake:8080 through the small network caddy-edge. Port 8791
# answers on the droplet itself, for checks. See DEPLOY.md.
name: snake

services:
  snake:
    # The same image the droplet already runs for Tichu's Caddy, so nothing new is downloaded.
    image: caddy:2.11.7-alpine
    container_name: snake
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 96m
    pids_limit: 64
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    tmpfs:
      - /tmp:size=8m,uid=1000,gid=1000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    ports:
      - '127.0.0.1:8791:8080'
    networks:
      - caddy-edge
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

networks:
  # Shared with Tichu's Caddy (and the Unser Jahr container). Snake never creates or removes it.
  caddy-edge:
    external: true
