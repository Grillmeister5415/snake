<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>castle-2d harness</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #e9dcef; color: #3a2348; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; box-shadow: 0 0 0 1px #b79cc8; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #lives { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(251,243,230,0.85); border-radius: 6px; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(251,243,230,0.92); border: 1px solid #e8558f; padding: 8px; border-radius: 6px; max-width: min(440px, calc(100vw - 32px)); }
  #ui button { font: inherit; margin: 2px; padding: 3px 7px; background: #fff; color: #3a2348; border: 1px solid #c9b4ec; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #e8558f; color: #fff; }
  #ui input[type=range] { width: 110px; vertical-align: middle; }
  #out { white-space: pre-wrap; margin-top: 4px; max-height: 42vh; overflow: auto; color: #7b2a6e; }
  #ui.min > :not(#toggle) { display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="flat"></canvas><canvas id="lives"></canvas></div></div>
<div id="ui">
  <button id="toggle">ui</button>
  <span id="cases"></span><br>
  <span id="sizes"></span><br>
  <label>chaos <input id="chaos" type="range" min="0" max="1" step="0.05" value="0"></label>
  <button id="bite">bite (B)</button><button id="play">play (Space)</button><button id="check">check (C)</button>
  <div id="out">loading…</div>
</div>
<script type="module" src="./castle-2d.js"></script>
</body>
</html>
