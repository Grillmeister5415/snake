<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lane room harness</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #2a0c22; color: #fff1d6; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; box-shadow: 0 0 0 1px #7a3a20; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #stage #lives { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(58,16,40,0.8); border-radius: 6px; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(58,16,40,0.88); border: 1px solid #ff6a1a; padding: 8px; border-radius: 6px; max-width: min(440px, calc(100vw - 32px)); }
  #ui button { font: inherit; margin: 2px; padding: 3px 7px; background: #3a1630; color: #fff1d6; border: 1px solid #8a4a2a; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #ff6a1a; color: #2a0c22; }
  #ui input[type=range] { width: 110px; vertical-align: middle; }
  #out { white-space: pre-wrap; margin-top: 4px; max-height: 42vh; overflow: auto; color: #ffd27a; }
  #ui.min > :not(#toggle) { display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="gl"></canvas><canvas id="lives"></canvas></div></div>
<div id="ui">
  <button id="toggle">ui</button>
  <span id="views"></span><br>
  <span id="cases"></span><br>
  <span id="sizes"></span><br>
  <label>chaos <input id="chaos" type="range" min="0" max="1" step="0.05" value="0"></label>
  <button id="bite">bite (B)</button><button id="pause">pause (Space)</button><button id="check">check (C)</button><button id="smooth">smooth (S)</button><br>
  <label><input id="rf" type="checkbox"> reduced flash</label>
  <label><input id="rm" type="checkbox"> reduced motion</label>
  <div id="out">loading…</div>
</div>
<script type="module" src="./lane.js"></script>
</body>
</html>
