<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>abyss harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #ddd; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; transform-origin: center center; box-shadow: 0 0 0 1px #444; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #lives { position: absolute; right: 8px; top: 8px; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(0,0,0,.8); padding: 8px; border-radius: 6px; max-width: 360px; }
  #ui button { font: inherit; margin: 2px; padding: 3px 7px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #e7b450; color: #000; border-color: #e7b450; }
  #out { white-space: pre; margin-top: 4px; color: #9f9; max-height: 52vh; overflow: auto; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c2"></canvas><canvas id="gl"></canvas><canvas id="lives"></canvas></div></div>
<div id="ui">
  <div><button data-look="2d">2d [1]</button><button data-look="board">3d [2]</button><button data-look="pov">pov [3]</button></div>
  <div><button data-case="moving">moving</button><button data-case="broken">broken</button><button data-case="respawn">respawn</button><button data-case="dead">dead</button><button data-case="bite">bite</button></div>
  <div><button data-size="land">1280×720</button><button data-size="port">390×844</button><button id="chaos">chaos</button><button id="rm">rm</button><button id="rf">rf</button></div>
  <div><button id="bitebtn">bite [B]</button><button id="check">check all [X]</button><button id="hide">hide [H]</button></div>
  <div id="out"></div>
</div>
<script type="module" src="./abyss.js"></script>
</body>
</html>
