<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlay harness</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 12px ui-monospace, Menlo, monospace; }
  #bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-items: center; }
  #bar button { font: inherit; background: #222; color: #eee; border: 1px solid #444; padding: 3px 6px; cursor: pointer; }
  #bar button.on { border-color: #19e6ff; color: #19e6ff; }
  #stage { position: relative; margin: 6px; background: #000; outline: 1px solid #333; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #out { white-space: pre-wrap; padding: 6px; max-width: 1280px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="out"></div>
<script type="module" src="./overlay.js"></script>
</body>
</html>
