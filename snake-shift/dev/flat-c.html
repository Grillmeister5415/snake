<head>
<meta charset="utf-8">

<title>SNAKE//SHIFT · flat-c harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; bottom: 8px; max-width: calc(100% - 16px); background: rgba(0,0,0,.72); padding: 6px 8px; white-space: pre-wrap; pointer-events: none; }
  #hud.hide { display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"></div>
<script type="module" src="./flat-c.js"></script>
