<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mushroom harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; transform-origin: center center; box-shadow: 0 0 0 1px #444; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(0,0,0,.8); padding: 8px; border-radius: 6px; max-width: 360px; }
  #ui button { font: inherit; margin: 2px; padding: 3px 7px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #7ff0c8; color: #000; border-color: #7ff0c8; }
  #out { white-space: pre; margin-top: 4px; color: #9f9; max-height: 46vh; overflow: auto; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="gl"></canvas><canvas id="cv"></canvas></div></div>
<div id="ui">
  <div id="looks"></div>
  <div id="cases"></div>
  <div>
    <button id="mush">mushroom [U]</button><button id="bite">bite [B]</button><button id="chaos">chaos [C]</button>
    <button id="run">run [Space]</button><button id="step">step [S]</button>
  </div>
  <div><button id="rf">reduced flash</button><button id="rm">reduced motion</button><button id="variant">variant+ [V]</button></div>
  <div id="sizes"></div>
  <div><button id="check">check all [X]</button><button id="hide">hide [H]</button></div>
  <div id="out"></div>
</div>
<script type="module" src="./mushroom.js"></script>
</body>
</html>
