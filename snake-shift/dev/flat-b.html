<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flat-b harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px/1.35 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { transform-origin: center center; box-shadow: 0 0 0 1px #444; }
  canvas { display: block; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(0,0,0,.78); padding: 8px; border-radius: 6px; max-width: 330px; }
  #ui button { font: inherit; margin: 2px; padding: 3px 7px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #00a0a0; color: #000; border-color: #00a0a0; }
  #ui .row { margin: 3px 0; }
  #stats, #check { white-space: pre; margin-top: 4px; color: #9f9; }
  #check { color: #fd6; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<div id="ui">
  <div class="row" id="tl"></div>
  <div class="row">
    <button id="bite">bite [B]</button><button id="auto">auto-bite [A]</button><button id="pause">pause [P]</button>
    <button id="kill">kill [K]</button><button id="reset">reset [R]</button><button id="long">long [L]</button>
  </div>
  <div class="row">
    <button id="rf">reduced flash [F]</button><button id="rm">reduced motion [M]</button><button id="chaos">chaos auto [C]</button>
  </div>
  <div class="row" id="sizes"></div>
  <div class="row"><button id="runcheck">check cells [X]</button><button id="hide">hide [H]</button></div>
  <div id="stats"></div>
  <div id="check"></div>
</div>
<script type="module">import(`./flat-b.js?v=${Date.now()}`);</script>
</body>
</html>
